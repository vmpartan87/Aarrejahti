  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#22150c; --panel:#33200f; } }
:root[data-theme="dark"]{ --bg:#22150c; --panel:#33200f; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{height:100%;margin:0;touch-action:manipulation}
#controls,#controls *,#game,#game canvas{touch-action:none;-webkit-user-select:none;user-select:none}
body{background:var(--bg);color:var(--txt);font-family:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%}
#hud{background:var(--panel);padding:6px 10px;display:flex;flex-direction:column;gap:4px;border-bottom:3px solid var(--btnEdge)}
.row{display:flex;align-items:center;gap:7px}
.sp{flex:1}
.chip{display:flex;align-items:center;gap:3px;background:var(--btn);border:none;border-radius:14px;padding:3px 7px 3px 4px;font-size:18px;font-weight:800;box-shadow:0 3px 0 var(--btnEdge);opacity:.65;min-width:52px}
.chip.act{opacity:1;outline:3px solid var(--gold)}
.badge{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:21px;font-weight:800;color:#fff;line-height:1}
.badge.t{background:var(--blue)} .badge.l{background:var(--green)}
.timer{font-size:14px;font-weight:800;color:var(--txt);background:#0004;border-radius:8px;padding:2px 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.paused{opacity:.5}
.timer.low{background:#e5484d;color:#fff;animation:tpulse .9s infinite}
@keyframes tpulse{50%{transform:scale(1.15);background:#ff2d2d}}
.money{font-size:22px;font-weight:800;color:var(--gold);white-space:nowrap}
.ib{background:var(--btn);border:none;border-radius:12px;width:40px;height:38px;font-size:19px;box-shadow:0 3px 0 var(--btnEdge);padding:0}
.ib.hide{display:none}
.lbl{font-size:15px;color:var(--muted);font-weight:600}
#bag{display:flex;gap:3px;flex:1;min-width:0}
.slot{border-radius:8px;background:#00000040;border:2px dashed #ffffff30;display:grid;place-items:center;flex:0 0 auto}
.slot.full{border:2px solid #ffffff55;background:#ffffff18}
#bag.flash .slot{animation:fl .5s 3}
@keyframes fl{50%{background:#ff5a3c90}}
#game{flex:1;position:relative;min-height:0}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#controls{background:var(--panel);display:flex;justify-content:space-between;align-items:center;padding:10px 10px 12px;gap:6px;border-top:3px solid var(--btnEdge)}
.pad{display:flex;gap:8px}
.mid{display:flex;flex-direction:column;gap:8px;align-items:center}
.b{width:min(20vw,86px);height:min(20vw,86px);border-radius:22px;border:none;background:var(--btn);font-size:min(9vw,38px);font-weight:800;
  box-shadow:0 6px 0 var(--btnEdge);display:grid;place-items:center;transition:transform .05s;padding:0}
.b.on{transform:translateY(4px);box-shadow:0 2px 0 var(--btnEdge);background:var(--btnHi)}
.b.lad{background:#8a5a1e}
.b.lad.on{background:#a8702a}
.mid.three{gap:5px}
.mid.three .b.sm{height:min(9.5vw,40px)}
.b.sm{width:min(14vw,60px);height:min(10.5vw,44px);border-radius:14px;font-size:min(5.5vw,22px);box-shadow:0 4px 0 var(--btnEdge)}
.b.sm .badge{width:min(8vw,32px);height:min(8vw,32px);font-size:min(6vw,24px)}
.b.pulse{animation:pls .7s infinite;background:#d4a017!important}
@keyframes pls{50%{transform:scale(1.12);box-shadow:0 0 18px #ffd23f}}
.b.home.auto{background:#2f7a3a}
#controls .b{position:relative}
.cnt{position:absolute;right:-4px;top:-6px;background:#e5484d;color:#fff;border-radius:12px;font-size:16px;min-width:26px;height:26px;display:grid;place-items:center;padding:0 5px;box-shadow:0 2px 0 #0006}
#controls .b.lad{width:min(22vw,96px);height:min(22vw,96px);font-size:min(10vw,44px)}
#joy{width:min(38vw,150px);height:min(38vw,150px);border-radius:50%;position:relative;flex:0 0 auto;touch-action:none;
  background:radial-gradient(circle,#00000020 0%,#00000055 70%);border:3px solid #ffffff2a}
#joy .ar{position:absolute;color:#ffffff55;font-size:min(5vw,20px);font-weight:800;line-height:1}
#knob{position:absolute;left:29%;top:29%;width:42%;height:42%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b07a45,#6b4223);
  box-shadow:0 5px 0 var(--btnEdge),inset 0 -4px 0 #00000030;pointer-events:none;transition:transform .06s}
#joy.on #knob{transition:none}
.big:disabled{opacity:.4}
.coll{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}
.cc{background:#f4dfb8;border-radius:12px;padding:6px 2px 4px;font-size:30px;line-height:1.1}
.cc.no{background:#e3d3b8;filter:grayscale(1);opacity:.6}
.cc small{display:block;font-size:12px;line-height:1.15;margin-top:2px}
.badge.n{background:#1f9e8f}
.combo{display:flex;justify-content:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.ci{width:58px;height:58px;border-radius:14px;background:#f4dfb8;display:grid;place-items:center;font-size:34px;position:relative;border:3px dashed #c9a877}
.ci.ok{background:#c9f2cf;border:3px solid #25b84a}
.ci small{position:absolute;right:-4px;bottom:-6px;font-size:20px;color:#25b84a;font-weight:800}
.gbs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0}
.gb{width:48px;height:48px;border-radius:12px;border:none;background:#e8cfa3;font-size:28px;box-shadow:0 3px 0 #b08d5a;padding:0}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:10;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.ov.show{display:flex}
.card{background:#fff3dc;color:#3a2516;border-radius:24px;padding:18px 18px;max-width:400px;width:100%;max-height:100%;overflow-y:auto;box-shadow:0 8px 0 #00000060;text-align:center;touch-action:pan-y}
.card h1{margin:0 0 6px;font-size:30px;line-height:1.1}
.card p{margin:6px 0;font-size:18px;line-height:1.35}
.help{text-align:left;font-size:17px;margin:10px 0;display:grid;grid-template-columns:44px 1fr;gap:5px 8px;align-items:center;line-height:1.25}
.help>span:nth-child(odd){font-size:24px;text-align:center}
.big{margin-top:10px;background:#25b84a;color:#fff;border:none;border-radius:18px;font-size:24px;font-weight:800;padding:8px 24px;box-shadow:0 5px 0 #177a30}
.big.alt{background:#c0763a;box-shadow:0 5px 0 #7a4519}
.big.gray{background:#8b7b6a;box-shadow:0 5px 0 #5a4c3f}
.chars{display:flex;justify-content:center;gap:12px;margin:6px 0}
.chars .badge{width:50px;height:50px;font-size:34px;border-radius:14px}
.badge.p{background:#9b3fb5}
.shop{display:flex;flex-direction:column;gap:10px;margin:10px 0;text-align:left}
.gear{display:grid;grid-template-columns:46px 1fr auto;gap:8px;align-items:center;background:#f4dfb8;border-radius:16px;padding:8px}

.gear small{display:block;font-size:15px;line-height:1.2;color:#6b4a2a}
.dots{letter-spacing:2px;font-size:13px;color:#c0763a}

.legend{font-size:15px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}
@media (prefers-reduced-motion: reduce){ #bag.flash .slot{animation:none} }
</style>
</head>

function pickItem(z){
  if(world===3)z=Math.min(z,3);
  const c=[];ITEMS.forEach((it,i)=>{if(it.z.includes(z)&&(world===3?it.w4:world===2?it.w3:world?(it.w2||it.part):(!it.w2&&!it.part&&!it.w3&&!it.w4)))c.push(i);});
  let tot=c.reduce((s,i)=>s+ITEMS[i].w,0),r=Math.random()*tot;
  for(const i of c){r-=ITEMS[i].w;if(r<=0)return i;}
  return c.length?c[c.length-1]:(z>0?pickItem(z-1):0);
}
function pickDemand(z){
  const c=[];ITEMS.forEach((it,i)=>{if(!it.special&&!it.rare&&!it.junk&&!it.part&&it.z.some(q=>q===z||q===z-1))c.push(i);});
  return c[rnd(c.length)];
}
function presentTypes(){
  const m=new Set();
  for(let y=world===3?1:SURF+1;y<H;y++){if(world!==3&&zoneOf(y)>maxPick())break;for(let x=0;x<W;x++){const it=items[y][x];if(it>=0&&!ITEMS[it].special&&!ITEMS[it].rare&&!ITEMS[it].junk&&!ITEMS[it].part)m.add(it);}}
  (chars||[]).forEach(c=>{if(c.captured<0)c.bag.forEach(it=>{if(!ITEMS[it].special&&!ITEMS[it].rare&&!ITEMS[it].junk&&!ITEMS[it].part)m.add(it);});});
  return [...m];
}
function chooseDemand(tz,last){
  const all=presentTypes();
  let c=all.filter(i=>ITEMS[i].z.some(q=>q===tz||q===tz-1)&&i!==last);
  if(!c.length)c=all.filter(i=>i!==last);
  if(!c.length)c=all;
  if(!c.length)return pickDemand(tz);
  return c[rnd(c.length)];
}
function makeCombo(){
  let pool=presentTypes();
  const good=pool.filter(i=>ITEMS[i].v>=10);if(good.length>=2)pool=good;
  for(let i=pool.length-1;i>0;i--){const j=rnd(i+1);[pool[i],pool[j]]=[pool[j],pool[i]];}
  const n=2+rnd(3);
  if(pool.length<2)return [2,3].slice(0,2);
  return pool.slice(0,Math.min(n,pool.length));
}

function sim(x,y,k){
  let nx=x,ny=y,cost=1;
  if(k<2){nx=x+(k?1:-1);if(nx<0||nx>=W)return null;}
  else if(k===2){ny=y+1;if(ny>=H)return null;}
  else{if((world!==3&&y<=SURF)||y<=0)return null;ny=y-1;cost=1.5;}
  const t=grid[ny][nx];
  if(liftWall(nx,ny))return null;
  if(t===ROCK){if(!(canSmash(simC)&&breakable(nx,ny)))return null;cost+=4;}
  if(t===DOOR&&!doorPass(nx,ny,x,y))return null;
  if(t===DIRT){if(!canDig(ny,simC))return null;cost+=3;}
  if(k===3)return {x:nx,y:ny,cost};
  let fy=ny;
  while(fy<H-1&&(world===3||fy!==SURF)&&grid[fy+1][nx]===AIR&&!ladders[fy][nx]&&!ladders[fy+1][nx])fy++;
  return {x:nx,y:fy,cost:cost+(fy-ny)*0.3};
}
const DIRS=['left','right','down','up'];
function planHome(c){return planTo(c,(x,y)=>inHomeT(x,y));}
let simC=null;
function planTo(c,goal){
  simC=c;
  const N=W*H,dist=new Float64Array(N).fill(1e9),first=new Int8Array(N).fill(-1),heap=[];
  const push=(d,i)=>{heap.push([d,i]);let k=heap.length-1;while(k>0){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p;}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){const l=2*k+1,r=l+1;let m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m;}}return top;};
  const s=c.y*W+c.x;dist[s]=0;push(0,s);
  while(heap.length){
    const [d,i]=pop();if(d>dist[i])continue;
    const x=i%W,y=(i/W)|0;
    if(goal(x,y))return first[i]>=0?DIRS[first[i]]:null;
    for(let k=0;k<4;k++){
      const r=sim(x,y,k);if(!r)continue;
      const j=r.y*W+r.x,nd=d+r.cost;
      if(nd<dist[j]){dist[j]=nd;first[j]=i===s?k:first[i];push(nd,j);}
    }
  }
  return undefined;
}

const rposD=(a,b)=>{const p=rpos(a),q=rpos(b);return Math.hypot(p.x-q.x,p.y-q.y);};

const CHASE_R=5;
const inReach=(tr,c)=>Math.max(Math.abs(c.x-tr.hx),Math.abs(c.y-tr.hy))<=(tr.angry?10:CHASE_R);
function stepToward(tr,x,y,dur){
  const dx=x-tr.x,dy=y-tr.y;
  let nx=tr.x,ny=tr.y;
  if(dx===0&&dy===0)return false;
  if(Math.abs(dx)>=Math.abs(dy))nx+=Math.sign(dx);else ny+=Math.sign(dy);
  ny=Math.max(SURF+2,Math.min(H-2,ny));nx=Math.max(1,Math.min(W-2,nx));
  if(nx===tr.x&&ny===tr.y)return false;
  move(tr,nx,ny,dur);return true;
}
function nearestFree(tr,r){

}

function updateTrolls(dt){
  trolls.forEach((tr,ti)=>{
    if(tr.dead)return;
    if(tr.busy){tr.t+=dt;if(tr.t>=tr.dur)tr.busy=false;}
    switch(tr.state){
      case 'sleep':
      case 'return':{
        const n=nearestFree(tr,tr.angry?3.6:2.6);
        if(n>=0){tr.state='alert';tr.timer=900;tr.target=n;sAlert();break;}
        if(tr.state==='return'&&!tr.busy){if(!stepToward(tr,tr.hx,tr.hy,300))tr.state='sleep';}
        break;}
      case 'alert':
        tr.timer-=dt;
        if(tr.timer<=0){const c=chars[tr.target];tr.state=(freeChar(c)&&inReach(tr,c))?'chase':'return';}
        break;
      case 'chase':{
        const c=chars[tr.target];
        if(!freeChar(c)||!inReach(tr,c)){tr.state='return';break;}
        if(rposD(tr,c)<0.6){capture(ti,tr.target);break;}
        if(!tr.busy)stepToward(tr,c.x,c.y,310);
        break;}
      case 'carry':{
        const c=chars[tr.prisoner];
        if(!tr.busy&&!stepToward(tr,tr.hx,tr.hy,240)){
          c.carried=false;c.x=c.sx=tr.hx+2;c.y=c.sy=tr.hy;c.busy=false;
          tr.state='guard';save();
        }
        break;}
      case 'guard':{
        const p=chars[tr.prisoner];
        tr.chk=(tr.chk||0)+dt;
        if(tr.chk>2000){tr.chk=0;if(!presentTypes().includes(tr.demand)){tr.demand=chooseDemand(zoneOf(tr.hy),tr.demand);
          floats.push({x:tr.hx+0.5,y:tr.hy-0.8,text:`Peikko keksi uuden toiveen: ${ITEMS[tr.demand].e}`,life:2500,max:2500,c:'#ffd23f'});}}
        chars.forEach((c,ci)=>{
          if(ci===tr.prisoner||c.captured>=0)return;
          if(Math.abs(c.x-(tr.hx+2))+Math.abs(c.y-tr.hy)>2)return;
          const k=c.bag.indexOf(tr.demand);
          if(k>=0){
            c.bag.splice(k,1);p.captured=-1;tr.prisoner=-1;tr.state='happy';tr.timer=20000;
            const I=ITEMS[tr.demand];
            floats.push({x:tr.hx+0.5,y:tr.hy-0.8,text:`Kiitos ${I.e}! ${NM(p)} on vapaa!`,life:2800,max:2800,c:'#9fffb0'});
            confetti(tr.hx+2.5,tr.hy,30);sFree();
            setTimeout(()=>giveGift(tr,c,p),900);renderHUD();save();
          }else{
            const now=performance.now();
            if(now-tr.lastMsg>3000){tr.lastMsg=now;const I=ITEMS[tr.demand];
              floats.push({x:tr.hx+0.5,y:tr.hy-0.8,text:`Peikko haluaa: ${I.e} ${I.n}`,life:2500,max:2500,c:'#ffd23f'});}
          }
        });
        break;}
      case 'happy':
        tr.timer-=dt;if(tr.timer<=0)tr.state='sleep';
        break;
    }
  });
}

let eng=null;
function engineOn(){
  if(!ac||eng)return;

    if(ac.state==='suspended')ac.resume();
    const agg=Math.min(1,car.moot/3);
    const o1=ac.createOscillator(),o2=ac.createOscillator(),sub=ac.createOscillator(),lfo=ac.createOscillator(),lfo2=ac.createOscillator();
    const lp=ac.createBiquadFilter(),g=ac.createGain(),am=ac.createGain(),lg=ac.createGain(),lg2=ac.createGain(),sg=ac.createGain(),sh=ac.createWaveShaper();
    o1.type='sawtooth';o2.type='square';sub.type='sine';lfo.type='square';lfo2.type='square';
    o1.frequency.value=45;o2.frequency.value=23;sub.frequency.value=22;lfo.frequency.value=11;lfo2.frequency.value=6;
    const k=5+agg*60,curve=new Float32Array(512);for(let i=0;i<512;i++){const x=i/256-1;curve[i]=(1+k)*x/(1+k*Math.abs(x));}
    sh.curve=curve;sh.oversample='2x';
    lp.type='lowpass';lp.frequency.value=500;lp.Q.value=4+agg*4;
    am.gain.value=0.55;lg.gain.value=0.35+agg*0.25;lg2.gain.value=agg*0.3;sg.gain.value=0.25+agg*0.6;
    g.gain.value=0;
    o1.connect(sh);o2.connect(sh);sh.connect(lp);sub.connect(sg);sg.connect(lp);lp.connect(am);am.connect(g);g.connect(ac.destination);
    lfo.connect(lg);lg.connect(am.gain);lfo2.connect(lg2);lg2.connect(am.gain);
    o1.start();o2.start();sub.start();lfo.start();lfo2.start();
    eng={o1,o2,sub,lfo,lfo2,lp,g,agg};
  }catch(e){eng=null;}
}

  if(!eng)return;
  try{const t=ac.currentTime;eng.g.gain.setTargetAtTime(0,t,0.05);const e=eng;setTimeout(()=>{try{e.o1.stop();e.o2.stop();e.sub.stop();e.lfo.stop();e.lfo2.stop();}catch(_){}},300);}catch(e){}

  const gas=curDir()==='right'&&drv.fuel>0;

}

    g.fillStyle=col;g.strokeStyle=dk;g.lineWidth=5;
    if(T){g.fillRect(x-48,30,96,30);g.strokeRect(x-48,30,96,30);g.fillRect(x-16,58,32,70);g.strokeRect(x-16,58,32,70);}
    else{g.fillRect(x-40,30,34,98);g.strokeRect(x-40,30,34,98);g.fillRect(x-40,100,80,28);g.strokeRect(x-40,100,80,28);}
    const ex=T?[x-18,x+18]:[x-32,x-14],ey=T?44:48;
    g.strokeStyle='#111';g.lineWidth=3;for(const e of ex){g.beginPath();g.arc(e,ey,6,Math.PI*1.1,Math.PI*1.9);g.stroke();}
    g.beginPath();const mx=T?x:x-23,my=T?84:78;g.arc(mx,my+8,8,Math.PI*1.15,Math.PI*1.85);g.stroke();
    return ex.map(e=>[e,ey+6]);
  }
  function frame(now){
    if(!timeUp||!document.getElementById('cry'))return;
    g.clearRect(0,0,440,200);
    const eT=body(130,'#2f7cf6','#16438f',true),eL=body(320,'#25b84a','#136b29',false);
    if(Math.random()<0.2){const src=[...eT,...eL][Math.floor(Math.random()*4)];tears.push({x:src[0],y:src[1],v:0});}
    g.fillStyle='#6ecbff';
    for(const d of tears){d.v+=0.25;d.y+=d.v;g.beginPath();g.moveTo(d.x,d.y-6);g.quadraticCurveTo(d.x+5,d.y+2,d.x,d.y+5);g.quadraticCurveTo(d.x-5,d.y+2,d.x,d.y-6);g.fill();}
    while(tears.length&&tears[0].y>200)tears.shift();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  beep(392,0.3,'triangle',0.06);beep(330,0.3,'triangle',0.06,0,0.3);beep(262,0.5,'triangle',0.06,0,0.6);
}
/* iOS Safari: estetään kaksoisnapautus- ja nipistyszoomaus */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
['controls','game'].forEach(id=>{const el=document.getElementById(id);if(!el||!el.addEventListener)return;
  el.addEventListener('touchstart',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
  el.addEventListener('touchend',e=>e.preventDefault(),{passive:false});
  el.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});});
let lastTouchEnd=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouchEnd<350&&!e.target.closest('.card'))e.preventDefault();lastTouchEnd=n;},{passive:false});
let last=performance.now(),saveT=0;
function loop(now){
  const dt=Math.min(50,now-last);last=now;
  tlTick(dt);
  if(running)update(dt);
  updateDynBtn();
  if(mode==='drive'){if(!running)engineUpdate();for(const f of floats)f.life-=dt;floats=floats.filter(f=>f.life>0);drawDrive(now);}
  else if(mode==='fish'){for(const f of floats)f.life-=dt;floats=floats.filter(f=>f.life>0);drawFish(now);}
  else if(mode==='party'){floats=[];drawParty(now);}
  else{floats=floats.filter(f=>!f.drive);tick(dt);draw(now);}
  saveT+=dt;if(saveT>4000){saveT=0;if(dirty)save();}
  requestAnimationFrame(loop);
}
addEventListener('visibilitychange',()=>{if(document.hidden)save();});
addEventListener('pagehide',save);

if(!load()){gear=NOGEAR();money=0;genWorld();newChars();}
resize();renderHUD();showStart();tlLoad();
requestAnimationFrame(loop);
})();
</script>
